[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphix"
version = "0.2.0"
description = "Typed gem5 statistics: parse, select, reduce, and export to pandas."
requires-python = ">=3.10"
dependencies = ["pandas>=2"]

[tool.setuptools.packages.find]
include = ["graphix*"]
